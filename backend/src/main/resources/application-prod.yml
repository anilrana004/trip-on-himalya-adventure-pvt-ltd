spring:
  jpa:
    show-sql: false

app:
  bootstrap-demo-data: false

server:
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        # Health only. Prometheus and Swagger describe the API and the JVM.
        # They stay on for the dev and test profiles. A public Railway port
        # has no Nginx in front of it, so they are not published here.
        include: health
  metrics:
    tags:
      application: securetravels
  prometheus:
    metrics:
      export:
        enabled: false
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: OFF